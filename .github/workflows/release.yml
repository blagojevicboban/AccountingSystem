name: Release ERPiFinansije

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Kapija kvaliteta: build i testovi moraju proći pre nego što se bilo šta objavi.
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prevođenje celog rešenja
        run: dotnet build ERPiFinansije.slnx -c Release

      - name: Pokretanje testova
        run: dotnet test ERPiFinansijeData.Tests\ERPiFinansijeData.Tests.csproj -c Release --no-build --verbosity normal

  build:
    needs: test
    # Na pull request-u se samo testira - release se objavljuje tek kad kod uđe u main.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Čitanje verzije iz fajla
        id: get_version
        run: |
          $ver = Get-Content version.txt
          $ver = $ver.Trim()
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Prevođenje koda (dotnet publish)
        run: |
          dotnet publish ERPiFinansijeApp\ERPiFinansijeApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$env:VERSION -o publish_output

      - name: Instalacija Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pakovanje (vpk pack)
        run: |
          $vpkArgs = @(
              "pack",
              "--packId", "ERPiFinansije",
              "--packVersion", $env:VERSION,
              "--packDir", "publish_output",
              "--mainExe", "ERPiFinansijeApp.exe",
              "--outputDir", "ReleasePackage",
              "--packTitle", "ERPi Finansije",
              "--packAuthors", "Blagojevic Boban",
              "--icon", "ERPiFinansijeApp\app.ico"
          )

          & vpk $vpkArgs

      - name: Objavljivanje na GitHub Releases
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --publish --releaseName "$env:VERSION" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir "ReleasePackage"
